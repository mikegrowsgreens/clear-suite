function getCravingStats() {
  const all = CravingStore.getAll();
  if (all.length === 0) return null;
  const now = Date.now();
  const week = all.filter(c => now - c.timestamp < 7 * 86400000);
  const surfed = all.filter(c => c.outcome === 'surfed');
  const triggers = {};

}

function getElapsed(qd) { return Math.max(0, Date.now() - new Date(qd).getTime()) }
function toLocalDateStr(d) { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); }
function formatDuration(ms) {
  if (ms < 0) return "0s";
  const s=Math.floor(ms/1000),m=Math.floor(s/60),h=Math.floor(m/60),d=Math.floor(h/24),y=Math.floor(d/365);
  if(y>0)return`${y}y ${d%365}d`;if(d>0)return`${d}d ${h%24}h`;
  if(h>0)return`${h}h ${m%60}m`;if(m>0)return`${m}m ${s%60}s`;return`${s}s`;
}
function formatTime(ms) {
  const s=Math.floor(ms/1000),m=Math.floor(s/60),h=Math.floor(m/60),d=Math.floor(h/24);
  if(d>365){const y=Math.floor(d/365);return`${y} year${y>1?'s':''}`;}
  if(d>0)return`${d} day${d>1?'s':''}`;if(h>0)return`${h} hour${h>1?'s':''}`;return`${m} min`;
}
function formatRelativeTime(ts) {
  const diff = Date.now() - ts;
  if (diff < 60000) return 'just now';
  if (diff < 3600000) return `${Math.floor(diff/60000)}m ago`;
  if (diff < 86400000) return `${Math.floor(diff/3600000)}h ago`;
  if (diff < 7*86400000) return `${Math.floor(diff/86400000)}d ago`;
  return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function getPhase(elapsed) {
  if(elapsed<24*H)return'acute';if(elapsed<72*H)return'peak';
  if(elapsed<30*D)return'recovery';if(elapsed<180*D)return'healing';return'healed';
}
function getDailyMotivation(elapsed) {
  const phase=getPhase(elapsed),msgs=MOTIVATIONAL[phase];
  return msgs[Math.floor(elapsed/D)%msgs.length];
}
function getContextualTip(elapsed) {
  if(elapsed<H)return"Your liver is already metabolizing the last dose. Caffeine's half-life is about 5 hours \u2014 the level only drops from here.";
  if(elapsed<8*H)return"Blood caffeine falling steadily. Drink water; mild fatigue later today is normal and expected.";
  if(elapsed<24*H)return"Caffeine still clearing \u2014 mostly gone by the 24-hour mark. Withdrawal, if it comes, starts around now. It is short and front-loaded.";
  if(elapsed<48*H)return"Peak withdrawal window. Headache, fatigue, and fog are receptor rebound, not damage. Hydrate, eat, rest \u2014 it crests and passes.";
  if(elapsed<72*H)return"Symptoms typically peak at 24-51 hours and ease from here. You are at or past the top of the hill.";
  if(elapsed<7*D)return"Withdrawal resolving \u2014 most people are symptom-free within 2-9 days. Deep sleep is already rebounding.";
  if(elapsed<14*D)return"Adenosine receptors normalizing (roughly 7-12 days). Slow-wave sleep increasing. Energy steadier every day.";
  if(elapsed<30*D)return"The 3pm crash is fading. Baseline anxiety lower. Mornings starting to work without a chemical bootstrap.";
  if(elapsed<90*D)return"Stable all-day energy consolidating. Blood pressure and resting heart rate at your true baseline.";
  if(elapsed<180*D)return"Sleep, energy, and calm fully rebalanced. Occasional cravings are habit echoes, not chemistry.";
  if(elapsed<Y)return"Approaching one year. Your alertness has been entirely your own for months.";
  return"A full year caffeine-free. Every system \u2014 sleep, energy, calm, heart \u2014 running on its natural rhythm.";
}
function getCategoryProgress(cat, elapsed) {
  let progress=0,currentLabel="Not started",currentTip="",nextLabel=cat.milestones[0]?.label||"",nextTime=cat.milestones[0]?.time||0;
  for(let i=0;i<cat.milestones.length;i++){
    const m=cat.milestones[i];
    if(elapsed>=m.time){
      progress=m.pct;currentLabel=m.label;currentTip=m.tip||"";
      if(i+1<cat.milestones.length){
        const next=cat.milestones[i+1];const segE=elapsed-m.time;const segT=next.time-m.time;
        const eased=1-Math.pow(1-Math.min(segE/segT,1),2);
        progress=m.pct+eased*(next.pct-m.pct);nextLabel=next.label;nextTime=next.time;
      }else{nextLabel="";nextTime=0;}
    }
  }
  if(elapsed<(cat.milestones[0]?.time||0)){
    const f=cat.milestones[0];progress=(elapsed/f.time)*f.pct;
    currentLabel="Recovery beginning";currentTip=f.tip||"";
  }
  return{progress:Math.min(progress,100),currentLabel,currentTip,nextLabel,nextTime};
}
function getWeightedHealth(elapsed) {
  return HEALTH_CATEGORIES.reduce((t,c)=>t+getCategoryProgress(c,elapsed).progress*c.weight,0);
}

function ProgressRing({progress,color,size=100,strokeWidth=8,animated=true,children}) {
  const r=(size-strokeWidth)/2,circ=2*Math.PI*r,offset=circ-(progress/100)*circ;
  return <div style={{position:'relative',width:size,height:size}}>
    <svg width={size} height={size} style={{transform:'rotate(-90deg)'}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" style={{stroke:'var(--ring-track)'}} strokeWidth={strokeWidth}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={strokeWidth} strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round" style={animated?{'--circ':circ,'--offset':offset,animation:'ringDraw 1.2s var(--ease-out) forwards',transition:'stroke-dashoffset 1s var(--ease-out)'}:{transition:'stroke-dashoffset 1s var(--ease-out)'}}/>
    </svg>
    <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column'}}>{children}</div>
  </div>;
}

function BreathingExercise({onClose, onLogCraving}) {
  const[phase,setPhase]=useState('idle');
  const[cycle,setCycle]=useState(0);
  const[seconds,setSeconds]=useState(0);
  const totalCycles=4;const timerRef=useRef(null);
  const phases={inhale:4,hold:4,exhale:6};
  useEffect(()=>{
    if(phase==='idle'||phase==='done')return;
    const dur=phases[phase];setSeconds(dur);
    timerRef.current=setInterval(()=>{
      setSeconds(prev=>{
        if(prev<=1){clearInterval(timerRef.current);
          if(phase==='inhale')setPhase('hold');
          else if(phase==='hold')setPhase('exhale');
          else if(phase==='exhale'){if(cycle+1>=totalCycles)setPhase('done');else{setCycle(c=>c+1);setPhase('inhale');}}
          return 0;}
        return prev-1;
      });
    },1000);
    return()=>clearInterval(timerRef.current);
  },[phase,cycle]);
  const ringP=phase==='idle'?0:phase==='done'?100:((phases[phase]-seconds)/phases[phase])*100;
  const pc=phase==='inhale'?'#f97316':phase==='hold'?'#fb923c':phase==='exhale'?'#a78bfa':'#f97316';
  const pl=phase==='idle'?'Ready':phase==='done'?'Complete':phase==='inhale'?'Breathe In':phase==='hold'?'Hold':'Breathe Out';
  return <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.92)',zIndex:100,display:'flex',alignItems:'center',justifyContent:'center',backdropFilter:'blur(20px)',animation:'fadeIn 0.3s ease-out'}}>
    <div onClick={e=>e.stopPropagation()} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:32,padding:40,animation:'scaleIn 0.4s var(--ease-spring)'}}>
      <div style={{textAlign:'center'}}>
        <h2 style={{fontFamily:'var(--font-display)',fontSize:24,color:'var(--text-primary)',marginBottom:4}}>{phase==='done'?'You made it.':'Ride the Craving'}</h2>
        <p style={{fontSize:13,color:'var(--text-secondary)'}}>{phase==='done'?'The craving has passed. You chose yourself.':'4-4-6 breathing to calm your nervous system'}</p>
      </div>
      <div style={{position:'relative'}}>
        <ProgressRing progress={ringP} color={pc} size={180} strokeWidth={6} animated={false}>
          <span style={{fontSize:48,fontWeight:300,color:pc,fontFamily:'var(--font-display)',animation:seconds>0?'countPulse 1s ease-in-out infinite':'none'}}>{phase==='idle'?'':phase==='done'?'\u2713':seconds}</span>
          <span style={{fontSize:14,fontWeight:600,color:'var(--text-secondary)',marginTop:4,letterSpacing:1,textTransform:'uppercase'}}>{pl}</span>
        </ProgressRing>
        {phase!=='idle'&&phase!=='done'&&<svg width={180} height={180} style={{position:'absolute',top:0,left:0,transform:'rotate(-90deg)'}}><circle cx={90} cy={90} r={87} fill="none" stroke={pc} strokeWidth={1} opacity={0.15} style={{animation:'breatheRing 4s ease-in-out infinite'}}/></svg>}
      </div>
      {phase!=='done'&&<div style={{display:'flex',gap:8}}>{Array.from({length:totalCycles},(_,i)=><div key={i} style={{width:8,height:8,borderRadius:'50%',background:i<cycle?'#f97316':i===cycle&&phase!=='idle'?pc:'var(--surface-soft)',transition:'all 0.3s'}}/>)}</div>}
      {phase==='idle'&&<button onClick={()=>setPhase('inhale')} style={{padding:'14px 48px',borderRadius:40,border:'none',cursor:'pointer',fontSize:15,fontWeight:700,fontFamily:'var(--font-body)',background:'linear-gradient(135deg, #f97316, #ea580c)',color:'#fff'}}>Begin</button>}
      {phase==='done'&&<div style={{ display:'flex', flexDirection:'column', gap:12, alignItems:'center' }}>
        <button onClick={() => { onLogCraving && onLogCraving(true); onClose(); }} style={{padding:'14px 48px',borderRadius:40,border:'none',cursor:'pointer',fontSize:15,fontWeight:700,fontFamily:'var(--font-body)',background:'linear-gradient(135deg, #f97316, #ea580c)',color:'#fff'}}>Log This Craving</button>
        <button onClick={onClose} style={{padding:'10px 32px',borderRadius:40,border:'1px solid var(--border-medium)',cursor:'pointer',fontSize:13,fontWeight:600,fontFamily:'var(--font-body)',background:'transparent',color:'var(--text-secondary)'}}>I'm Good</button>
      </div>}
      <button onClick={onClose} style={{background:'none',border:'none',color:'var(--text-muted)',fontSize:13,cursor:'pointer',fontFamily:'var(--font-body)',padding:8}}>close</button>
    </div>
  </div>;

}

    {icon:"\uD83C\uDF31",title:"Recovery starts in hours",body:"Caffeine's half-life is about 5 hours \u2014 it is mostly out of your system within a day. From that point on, everything you feel is your brain resetting, and every hour counts.",source:"Caffeine pharmacokinetics; Juliano & Griffiths 2004"},
    {icon:"\u26A1",title:"Six dimensions of recovery",body:"Track your adenosine reset, sleep quality, natural energy, anxiety and calm, heart and blood pressure, and digestion. All grounded in clinical research \u2014 and the withdrawal is short and front-loaded: worst by day 2, gone within about a week for most people.",source:"Psychopharmacology, J Clin Sleep Med"},

    </div>
  </div>;

function ThemeToggle({ prefix }) {
  const [theme, setTheme] = React.useState(() => localStorage.getItem(prefix + '_theme') || 'auto');
  React.useEffect(() => {
    const applyTheme = () => {
      let resolved = theme;
      if (theme === 'auto') { resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
      document.documentElement.setAttribute('data-theme', resolved);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', resolved === 'dark' ? '#0c0806' : '#f8fafc');
    };
    applyTheme();
    localStorage.setItem(prefix + '_theme', theme);
    if (theme === 'auto') {
      const mq = window.matchMedia('(prefers-color-scheme: dark)');
      mq.addEventListener('change', applyTheme);
      return () => mq.removeEventListener('change', applyTheme);
    }
  }, [theme]);
  const cycle = () => { const order = ['auto', 'light', 'dark']; setTheme(order[(order.indexOf(theme) + 1) % 3]); };
  const icons = { auto: '\u25D0', light: '\u2600', dark: '\u263E' };
  const labels = { auto: 'Auto', light: 'Light', dark: 'Dark' };
  return (
    <button onClick={cycle} title={`Theme: ${labels[theme]}`} style={{
      background:'var(--surface-faint)',border:'1px solid var(--border-subtle)',
      color:'var(--text-muted)',width:36,height:36,borderRadius:'50%',cursor:'pointer',
      fontSize:16,display:'flex',alignItems:'center',justifyContent:'center'
    }}>{icons[theme]}</button>
  );
}

function Dashboard({config,onUpdateConfig,onReset}) {
  const[now,setNow]=useState(Date.now());const[activeTab,setActiveTab]=useState('health');
  const[detailCat,setDetailCat]=useState(null);const[showSettings,setShowSettings]=useState(false);
  const[showBreathing,setShowBreathing]=useState(false);
  const [showCravingLog, setShowCravingLog] = useState(false);
  const [prefillBreathing, setPrefillBreathing] = useState(false);
  const[newAchievement,setNewAchievement]=useState(null);const prevRef=useRef(null);
  useEffect(()=>{const t=setInterval(()=>setNow(Date.now()),1000);return()=>clearInterval(t);},[]);
  const elapsed=getElapsed(config.quitDate);
  const moneySaved=((elapsed/D)*config.dailySpend).toFixed(2);
  const daysClean=Math.floor(elapsed/D);
  const drinksAvoided=daysClean*(config.drinksPerDay||0);
  const mgAvoided=daysClean*(config.mgPerDay||0);
  const overallHealth=getWeightedHealth(elapsed);
  const unlockedAchs=ACHIEVEMENTS.filter(a=>elapsed>=a.time);
  const unlockedCount=unlockedAchs.length;
  const latestUnlocked=[...ACHIEVEMENTS].reverse().find(a=>elapsed>=a.time);
  const nextAch=ACHIEVEMENTS.find(a=>elapsed<a.time);
  const motivation=getDailyMotivation(elapsed);
  const tip=getContextualTip(elapsed);
  const seenAchs=Store.getSeen();

  useEffect(()=>{
    if(prevRef.current===null){prevRef.current=unlockedCount;return;}
    if(unlockedCount>prevRef.current){
      const newest=unlockedAchs[unlockedAchs.length-1];
      if(!seenAchs.includes(newest.label)){
        setNewAchievement(newest);Store.markSeen(newest.label);
        setTimeout(()=>{setNewAchievement(null);},4500);
      }
    }
    prevRef.current=unlockedCount;
  },[unlockedCount]);

  const ts=(a)=>({flex:1,padding:'12px 0',textAlign:'center',fontSize:11,fontWeight:700,color:a?'var(--orange-primary)':'var(--text-muted)',cursor:'pointer',transition:'all 0.2s',letterSpacing:0.8,textTransform:'uppercase',background:'none',border:'none',borderBottom:a?'2px solid var(--orange-primary)':'2px solid transparent',fontFamily:'var(--font-body)'});

  const thirdStat = drinksAvoided > 0 ? {label:'Drinks Skipped',value:drinksAvoided.toLocaleString(),color:'var(--orange-bright)'} : mgAvoided > 0 ? {label:'Mg Avoided',value:mgAvoided.toLocaleString(),color:'var(--orange-bright)'} : {label:'Milestones',value:`${unlockedCount}/${ACHIEVEMENTS.length}`,color:'var(--orange-bright)'};

  return <div style={{minHeight:'100vh',minHeight:'100dvh',maxWidth:440,margin:'0 auto',position:'relative'}}>
    {newAchievement&&<div style={{position:'fixed',top:20,left:'50%',transform:'translateX(-50%)',zIndex:150,padding:'16px 24px',borderRadius:'var(--radius-lg)',background:'linear-gradient(135deg,rgba(249,115,22,0.12),rgba(167,139,250,0.08))',border:'1px solid var(--border-accent)',backdropFilter:'blur(16px)',display:'flex',alignItems:'center',gap:14,animation:'slideDown 0.5s var(--ease-spring)',maxWidth:380,boxShadow:'0 8px 32px rgba(0,0,0,0.4)'}}>
      <span style={{fontSize:36}}>{newAchievement.icon}</span>
      <div>
        <div style={{fontSize:10,color:'var(--orange-primary)',fontWeight:700,letterSpacing:1,textTransform:'uppercase'}}>Achievement Unlocked</div>
        <div style={{fontSize:15,fontWeight:700,color:'var(--text-primary)',marginTop:2}}>{newAchievement.label}</div>
      </div>
    </div>}

    <div style={{padding:'20px 20px 0',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
      <h1 style={{fontFamily:'var(--font-display)',fontSize:22,letterSpacing:-0.3,color:'var(--text-primary)'}}>Clear Energy</h1>
      <div style={{display:'flex',gap:8}}>
        <ThemeToggle prefix="clearenergy" />
        <button onClick={()=>setShowBreathing(true)} style={{background:'rgba(249,115,22,0.08)',border:'1px solid rgba(249,115,22,0.15)',color:'var(--orange-primary)',width:36,height:36,borderRadius:'50%',cursor:'pointer',fontSize:16,display:'flex',alignItems:'center',justifyContent:'center'}} title="Craving? Breathe.">{"\uD83C\uDF2C\uFE0F"}</button>
        <button onClick={()=>setShowSettings(true)} style={{background:'var(--surface-faint)',border:'1px solid var(--border-subtle)',color:'var(--text-muted)',width:36,height:36,borderRadius:'50%',cursor:'pointer',fontSize:16}}>{"\u2699"}</button>
      </div>
    </div>

    <div style={{display:'flex',flexDirection:'column',alignItems:'center',padding:'28px 0 12px'}}>
      <ProgressRing progress={overallHealth} color="var(--orange-primary)" size={160} strokeWidth={10}>
        <span style={{fontSize:38,fontWeight:300,color:'var(--orange-primary)',fontFamily:'var(--font-display)'}}>{Math.round(overallHealth)}%</span>
        <span style={{fontSize:10,color:'var(--text-muted)',fontWeight:600,letterSpacing:1.5,textTransform:'uppercase',marginTop:2}}>Repaired</span>
      </ProgressRing>
      <div style={{marginTop:14,fontSize:18,fontWeight:400,color:'var(--text-secondary)',fontFamily:'var(--font-display)',letterSpacing:-0.3}}>{formatDuration(elapsed)}</div>
      <div style={{fontSize:11,color:'var(--text-muted)',marginTop:2}}>free since {new Date(config.quitDate).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}</div>
      {(()=>{try{const s=JSON.parse(localStorage.getItem('clearenergy_streaks')||'[]');if(!s.length)return null;const prior=s.reduce((t,x)=>t+(x.days||0),0);const total=prior+daysClean;return <div style={{fontSize:10,color:'var(--text-muted)',marginTop:4}}>{total.toLocaleString()} free days so far</div>}catch{return null}})()}
      {config.motivation && <div style={{fontSize:11,color:'var(--orange-primary)',marginTop:6,fontStyle:'italic',opacity:0.8}}>{config.motivation}</div>}
    </div>

    <div style={{display:'flex',gap:8,padding:'8px 20px',justifyContent:'center'}}>
      {[
        {label:'Saved',value:`$${moneySaved}`,color:'var(--orange-primary)'},
        {label:'Days',value:daysClean.toLocaleString(),color:'var(--orange-bright)'},
        thirdStat
      ].map((s,i)=><div key={i} style={{flex:1,textAlign:'center',padding:'14px 8px',borderRadius:'var(--radius-md)',background:'var(--bg-card)',border:'1px solid var(--border-subtle)',animation:`slideUp 0.5s var(--ease-out) ${i*80}ms both`}}>
        <div style={{fontSize:18,fontWeight:700,color:s.color,letterSpacing:-0.5}}>{s.value}</div>
        <div style={{fontSize:9,color:'var(--text-muted)',fontWeight:600,marginTop:3,textTransform:'uppercase',letterSpacing:0.5}}>{s.label}</div>
      </div>)}
    </div>

    <div style={{margin:'8px 20px',padding:'14px 18px',borderRadius:'var(--radius-md)',background:'linear-gradient(135deg,rgba(249,115,22,0.04),rgba(167,139,250,0.02))',borderLeft:'3px solid var(--orange-primary)'}}>
      <p style={{fontSize:13,color:'var(--text-secondary)',lineHeight:1.6,fontStyle:'italic',fontFamily:'var(--font-display)'}}>&ldquo;{motivation}&rdquo;</p>
    </div>

    <div style={{margin:'4px 20px 8px',padding:'10px 14px',borderRadius:'var(--radius-md)',background:'var(--surface-faint)',border:'1px solid var(--border-subtle)'}}>
      <p style={{fontSize:11,color:'var(--text-muted)',lineHeight:1.5}}>{tip}</p>
    </div>

    {nextAch&&<div style={{margin:'4px 20px',padding:'14px 18px',borderRadius:'var(--radius-md)',background:'var(--bg-card)',border:'1px solid var(--border-medium)',display:'flex',alignItems:'center',gap:14}}>
      <span style={{fontSize:28}}>{nextAch.icon}</span>
      <div style={{flex:1}}>
        <div style={{fontSize:10,color:'var(--orange-primary)',fontWeight:700,letterSpacing:0.5,textTransform:'uppercase'}}>Next</div>
        <div style={{fontSize:14,fontWeight:600,color:'var(--text-primary)'}}>{nextAch.label}</div>
        <div style={{fontSize:11,color:'var(--text-muted)'}}>{nextAch.time-elapsed>0?`in ${formatDuration(nextAch.time-elapsed)}`:'Almost there...'}</div>
      </div>
      <div style={{width:42,height:42,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',background:'rgba(249,115,22,0.06)',border:'1px solid var(--border-medium)',fontSize:11,fontWeight:800,color:'var(--orange-primary)'}}>{Math.min(100,Math.round((elapsed/nextAch.time)*100))}%</div>
    </div>}

    <div style={{display:'flex',margin:'20px 20px 0',gap:0}}>
      <button style={ts(activeTab==='health')} onClick={()=>setActiveTab('health')}>Recovery</button>
      <button style={ts(activeTab==='badges')} onClick={()=>setActiveTab('badges')}>Milestones</button>
      <button style={ts(activeTab === 'cravings')} onClick={() => setActiveTab('cravings')}>Cravings</button>
    </div>

    <div style={{padding:'16px 20px 120px'}}>
      {activeTab==='health'&&<div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10}}>
        {HEALTH_CATEGORIES.map((cat,i)=><HealthRingCard key={cat.id} category={cat} elapsed={elapsed} onClick={()=>setDetailCat(cat)} delay={i*60}/>)}
      </div>}
      {activeTab==='badges'&&<>
        {latestUnlocked&&<div style={{padding:24,borderRadius:'var(--radius-lg)',marginBottom:16,textAlign:'center',background:'linear-gradient(135deg,rgba(249,115,22,0.06),rgba(249,115,22,0.02))',border:'1px solid var(--border-medium)',animation:'scaleIn 0.4s var(--ease-spring)'}}>
          <span style={{fontSize:44}}>{latestUnlocked.icon}</span>
          <div style={{fontFamily:'var(--font-display)',fontSize:18,color:'var(--orange-primary)',marginTop:10}}>{latestUnlocked.label}</div>
          <div style={{fontSize:13,color:'var(--text-secondary)',marginTop:6,lineHeight:1.5}}>{latestUnlocked.desc}</div>
        </div>}
        <div style={{display:'grid',gridTemplateColumns:'repeat(4, 1fr)',gap:14}}>
          {ACHIEVEMENTS.map((ach,i)=>{const unlocked=elapsed>=ach.time;const isNew=unlocked&&!seenAchs.includes(ach.label);return <AchievementBadge key={i} ach={ach} unlocked={unlocked} isNew={isNew}/>;
          })}
        </div>
      </>}
      {activeTab === 'cravings' && <CravingsTab onOpenLog={() => { setPrefillBreathing(false); setShowCravingLog(true); }} />}
    </div>

    <DetailModal category={detailCat} elapsed={elapsed} onClose={()=>setDetailCat(null)}/>
    {showSettings&&<SettingsModal config={config} onSave={c=>{Store.save(c);onUpdateConfig(c);}} onReset={onReset} onClose={()=>setShowSettings(false)}/>}
    {showBreathing&&<BreathingExercise onClose={()=>setShowBreathing(false)} onLogCraving={(fromBreathing)=>{setPrefillBreathing(fromBreathing);setShowCravingLog(true);}}/>}
    {showCravingLog && <CravingLogModal onClose={() => setShowCravingLog(false)} prefillBreathing={prefillBreathing} onSave={(entry) => { CravingStore.add(entry); }} />}
  </div>;
}

// One-time cleanup: this suite is free forever. Remove the monetization keys
// that older builds wrote, so nobody is left mid-"trial".
(function(){
  try {
    ['clearenergy_first_opened','clearenergy_paywall_snooze','clear_suite_unlocked',
     'clear_suite_unlock_method','clear_suite_promo_code']
      .forEach(function(k){ localStorage.removeItem(k); });
  } catch (e) {}
})();

function App() {
  const[config,setConfig]=useState(()=>Store.get());
  const[showOnboarding,setShowOnboarding]=useState(()=>!Store.hasOnboarded()&&!Store.get());
  const handleSetup=(c)=>{Store.save(c);setConfig(c);};
  const handleUpdate=(c)=>{Store.save(c);setConfig(c);};
  const handleReset=()=>{Store.clear();CravingStore.clear();['clearenergy_seen','clearenergy_onboarded','clearenergy_streaks'].forEach(k=>localStorage.removeItem(k));setConfig(null);setShowOnboarding(true);};
  if(showOnboarding)return<Onboarding onComplete={()=>setShowOnboarding(false)}/>;
  if(!config||!config.quitDate)return<SetupScreen onSave={handleSetup}/>;
  return <Dashboard config={config} onUpdateConfig={handleUpdate} onReset={handleReset}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
/* Clear Suite update channel.
   Deliberately plain JS in its own script tag, NOT a React component: this
   must keep working when React/Babel fail to load, because that is exactly
   the deploy an update needs to repair. */
(function () {
  if (!('serviceWorker' in navigator)) return;

  var MIN_INTERVAL  = 30 * 1000;
  var POLL_INTERVAL = 30 * 60 * 1000;
  var hadController = !!navigator.serviceWorker.controller;
  var lastCheck     = Date.now();
  var reg           = null;

  window.__CS_VERSION = null;

  function show() {
    if (document.getElementById('cs-update')) return;
    var el = document.createElement('div');
    el.id = 'cs-update';
    el.setAttribute('role', 'status');
    el.setAttribute('aria-live', 'polite');
    /* zIndex 90 sits BELOW the app's modals (zIndex 100), so an open craving
       log or breathing overlay hides this automatically. */
    el.style.cssText =
      'position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:90;' +
      'width:calc(100% - 32px);max-width:380px;box-sizing:border-box;' +
      'padding:14px 16px;border-radius:var(--radius-lg);' +
      'background:linear-gradient(135deg,var(--accent-glow),var(--surface-faint)),var(--bg-card);' +
      'border:1px solid var(--border-medium);backdrop-filter:blur(16px);' +
      '-webkit-backdrop-filter:blur(16px);box-shadow:0 8px 32px rgba(0,0,0,0.4);' +
      'display:flex;align-items:center;gap:12px;animation:slideDown 0.5s var(--ease-spring);' +
      'font-family:var(--font-body);letter-spacing:-0.01em';

    var txt = document.createElement('div');
    txt.style.cssText = 'flex:1;min-width:0';
    txt.innerHTML =
      '<div style="font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;' +
      'color:var(--accent-primary)">Update ready</div>' +
      '<div style="font-size:14px;font-weight:600;color:var(--text-primary);margin-top:2px">' +
      'A new version is ready</div>' +
      '<div style="font-size:11px;color:var(--text-secondary);margin-top:2px">' +
      'Your progress is saved either way.</div>';

    var reload = document.createElement('button');
    reload.textContent = 'Reload';
    reload.style.cssText =
      'flex:none;background:var(--accent-primary);border:none;color:var(--bg-deep);' +
      'font-family:var(--font-body);font-size:12px;font-weight:700;letter-spacing:0.3px;' +
      'padding:9px 14px;border-radius:var(--radius-sm);cursor:pointer';
    reload.onclick = function () { window.location.reload(); };

    var later = document.createElement('button');
    later.setAttribute('aria-label', 'Dismiss');
    later.innerHTML = '×';
    later.style.cssText =
      'flex:none;background:var(--surface-soft);border:none;color:var(--text-secondary);' +
      'width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px;line-height:1';
    /* Dismiss only hides it. The update is already in Cache Storage, so the
       user gets it on their next cold launch regardless. */
    later.onclick = function () { el.remove(); };

    el.appendChild(txt); el.appendChild(reload); el.appendChild(later);
    document.body.appendChild(el);
  }

  function check() {
    var now = Date.now();
    if (now - lastCheck < MIN_INTERVAL) return;
    lastCheck = now;
    if (reg) { try { reg.update(); } catch (_) {} }
    if (navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage({ type: 'CHECK_UPDATE' });
    }
  }

  function askVersion() {
    if (!navigator.serviceWorker.controller || !window.MessageChannel) return;
    var ch = new MessageChannel();
    ch.port1.onmessage = function (ev) {
      if (ev.data && ev.data.type === 'VERSION') {
        window.__CS_VERSION = ev.data.version;
        window.dispatchEvent(new CustomEvent('cs-version', { detail: ev.data }));
      }
    };
    navigator.serviceWorker.controller.postMessage({ type: 'GET_VERSION' }, [ch.port2]);
  }

  navigator.serviceWorker.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.type === 'UPDATE_READY') show();
    else if (d.type === 'HTML_REPLACED') { window.__CS_VERSION = d.version; }
  });

  /* Do NOT reload here — the classic footgun that reloads a user mid-session. */
  navigator.serviceWorker.addEventListener('controllerchange', askVersion);

  /* iOS has no Periodic Background Sync, so every check is user-driven:
     resume, focus, regained network. iOS also often restores a frozen page
     instead of reloading, which is why pageshow/visibilitychange matter most. */
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') check();
  });
  window.addEventListener('focus', check);
  window.addEventListener('online', check);
  window.addEventListener('pageshow', function (e) { if (e.persisted) check(); });
  setInterval(function () { if (document.visibilityState === 'visible') check(); }, POLL_INTERVAL);

  navigator.serviceWorker.register('/sw.js', { scope: '/', updateViaCache: 'none' })
    .then(function (r) {
      reg = r;
      askVersion();
      r.addEventListener('updatefound', function () {
        var nw = r.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function () {
          if (nw.state === 'activated' && hadController) show();
        });
      });
    })
    .catch(function () { /* SW unavailable: app still works, just no offline */ });
})();
</script>
