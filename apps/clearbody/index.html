const Store = {
  _key: 'clearbody_data',
  get() { try { const d = localStorage.getItem(this._key); return d ? JSON.parse(d) : null } catch { return null } },
  save(data) { try { localStorage.setItem(this._key, JSON.stringify({ ...data, updatedAt: Date.now() })) } catch {} },
  clear() { localStorage.removeItem(this._key) },
  getSeen() { try { const d = localStorage.getItem('clearbody_seen'); return d ? JSON.parse(d) : [] } catch { return [] } },
  markSeen(label) { try { const s = this.getSeen(); if (!s.includes(label)) { s.push(label); localStorage.setItem('clearbody_seen', JSON.stringify(s)) } } catch {} },
  hasOnboarded() { return localStorage.getItem('clearbody_onboarded') === 'true' },
  setOnboarded() { localStorage.setItem('clearbody_onboarded', 'true') }
};

const CravingStore = {
  _key: 'clearbody_cravings',
  getAll() { try { const d = localStorage.getItem(this._key); return d ? JSON.parse(d) : []; } catch { return []; } },
  add(entry) { try { const all = this.getAll(); all.unshift({ ...entry, id: Date.now(), timestamp: Date.now() }); localStorage.setItem(this._key, JSON.stringify(all)); } catch {} },
  clear() { localStorage.removeItem(this._key); }
};
function getCravingStats() {
  const all = CravingStore.getAll();
  if (all.length === 0) return null;
  const now = Date.now();
  const week = all.filter(c => now - c.timestamp < 7 * 86400000);
  const surfed = all.filter(c => c.outcome === 'surfed');
  const triggers = {};
  all.forEach(c => { (c.triggers || []).forEach(t => { triggers[t] = (triggers[t] || 0) + 1; }); });
  const topTriggers = Object.entries(triggers).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const weekAvg = week.length > 0 ? Math.round((week.reduce((s, c) => s + (c.intensity || 5), 0) / week.length) * 10) / 10 : 0;
  return { total: all.length, thisWeek: week.length, surfedCount: surfed.length, surfedRate: all.length > 0 ? Math.round((surfed.length / all.length) * 100) : 0, topTriggers, weekAvgIntensity: weekAvg };
}

function getElapsed(qd) { return Math.max(0, Date.now() - new Date(qd).getTime()) }
function toLocalDateStr(d) { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); }
function formatDuration(ms) {
  if (ms < 0) return "0s";
  const s=Math.floor(ms/1000),m=Math.floor(s/60),h=Math.floor(m/60),d=Math.floor(h/24),y=Math.floor(d/365);
  if(y>0)return`${y}y ${d%365}d`;if(d>0)return`${d}d ${h%24}h`;
  if(h>0)return`${h}h ${m%60}m`;if(m>0)return`${m}m ${s%60}s`;return`${s}s`;
}
function formatTime(ms) {
  const s=Math.floor(ms/1000),m=Math.floor(s/60),h=Math.floor(m/60),d=Math.floor(h/24);
  if(d>365){const y=Math.floor(d/365);return`${y} year${y>1?'s':''}`;}
  if(d>0)return`${d} day${d>1?'s':''}`;if(h>0)return`${h} hour${h>1?'s':''}`;return`${m} min`;
}
function formatRelativeTime(ts) {
  const diff = Date.now() - ts;
  if (diff < 60000) return 'just now';
  if (diff < 3600000) return `${Math.floor(diff/60000)}m ago`;
  if (diff < 86400000) return `${Math.floor(diff/3600000)}h ago`;
  if (diff < 7*86400000) return `${Math.floor(diff/86400000)}d ago`;
  return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function getPhase(elapsed) {
  if(elapsed<24*H)return'acute';if(elapsed<72*H)return'peak';
  if(elapsed<30*D)return'recovery';if(elapsed<180*D)return'healing';return'healed';
}
function getDailyMotivation(elapsed) {
  const phase=getPhase(elapsed),msgs=MOTIVATIONAL[phase];
  return msgs[Math.floor(elapsed/D)%msgs.length];
}
function getContextualTip(elapsed) {
  if(elapsed<H)return"Your body is clearing the last processed meal. Blood sugar beginning to stabilize. Drink water.";
  if(elapsed<8*H)return"Insulin levels dropping. First cravings may appear soon. They arrive in waves that build and ease rather than climbing forever.";

  if(elapsed<72*H)return"Peak craving window. Days 2-3 are typically the hardest. You are almost through it.";
  if(elapsed<7*D)return"Cravings beginning to fade. Gut bacteria are shifting. Bloating and puffiness decreasing.";
  if(elapsed<14*D)return"Around two weeks, triglycerides and LDL start to move \u2014 and independently of weight, which makes it the sugar itself.";
  if(elapsed<30*D)return"Energy stabilizing. Skin clearing. Sleep improving. Gut microbiome actively recolonizing.";
  if(elapsed<90*D)return"Deep metabolic changes in progress. Sweet things taste sweeter than they used to. New food habits becoming automatic.";
  if(elapsed<180*D)return"Months in. Lipids, liver fat and blood pressure are the markers with real evidence behind them. Cravings come and go without running the day.";
  if(elapsed<Y)return"Approaching the one-year mark. Diabetes risk dropping. Gut health fully restored.";
  return"Full metabolic transformation. Every system in your body has benefited from this decision.";
}
function getCategoryProgress(cat, elapsed) {
  let progress=0,currentLabel="Not started",currentTip="",nextLabel=cat.milestones[0]?.label||"",nextTime=cat.milestones[0]?.time||0;
  for(let i=0;i<cat.milestones.length;i++){
    const m=cat.milestones[i];
    if(elapsed>=m.time){
      progress=m.pct;currentLabel=m.label;currentTip=m.tip||"";
      if(i+1<cat.milestones.length){
        const next=cat.milestones[i+1];const segE=elapsed-m.time;const segT=next.time-m.time;
        const eased=1-Math.pow(1-Math.min(segE/segT,1),2);
        progress=m.pct+eased*(next.pct-m.pct);nextLabel=next.label;nextTime=next.time;
      }else{nextLabel="";nextTime=0;}
    }
  }
  if(elapsed<(cat.milestones[0]?.time||0)){
    const f=cat.milestones[0];progress=(elapsed/f.time)*f.pct;
    currentLabel="Recovery beginning";currentTip=f.tip||"";
  }
  return{progress:Math.min(progress,100),currentLabel,currentTip,nextLabel,nextTime};
}

function ProgressRing({progress,color,size=100,strokeWidth=8,animated=true,children}) {
  const r=(size-strokeWidth)/2,circ=2*Math.PI*r,offset=circ-(progress/100)*circ;
  return <div style={{position:'relative',width:size,height:size}}>
    <svg width={size} height={size} style={{transform:'rotate(-90deg)'}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" style={{stroke:'var(--ring-track)'}} strokeWidth={strokeWidth}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={strokeWidth} strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round" style={animated?{'--circ':circ,'--offset':offset,animation:'ringDraw 1.2s var(--ease-out) forwards',transition:'stroke-dashoffset 1s var(--ease-out)'}:{transition:'stroke-dashoffset 1s var(--ease-out)'}}/>
    </svg>
    <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column'}}>{children}</div>
  </div>;
}

function BreathingExercise({onClose, onLogCraving}) {
  const[phase,setPhase]=useState('idle');
  const[cycle,setCycle]=useState(0);
  const[seconds,setSeconds]=useState(0);
  const totalCycles=4;const timerRef=useRef(null);
  const phases={inhale:4,hold:4,exhale:6};
  useEffect(()=>{
    if(phase==='idle'||phase==='done')return;
    const dur=phases[phase];setSeconds(dur);
    timerRef.current=setInterval(()=>{
      setSeconds(prev=>{
        if(prev<=1){clearInterval(timerRef.current);
          if(phase==='inhale')setPhase('hold');
          else if(phase==='hold')setPhase('exhale');
          else if(phase==='exhale'){if(cycle+1>=totalCycles)setPhase('done');else{setCycle(c=>c+1);setPhase('inhale');}}
          return 0;}
        return prev-1;
      });
    },1000);
    return()=>clearInterval(timerRef.current);
  },[phase,cycle]);
  const ringP=phase==='idle'?0:phase==='done'?100:((phases[phase]-seconds)/phases[phase])*100;
  const pc=phase==='inhale'?'var(--accent-primary)':phase==='hold'?'var(--accent-strong)':phase==='exhale'?'var(--purple)':'var(--accent-primary)';
  const pl=phase==='idle'?'Ready':phase==='done'?'Complete':phase==='inhale'?'Breathe In':phase==='hold'?'Hold':'Breathe Out';
  return <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.92)',zIndex:100,display:'flex',alignItems:'center',justifyContent:'center',backdropFilter:'blur(20px)',animation:'fadeIn 0.3s ease-out'}}>
    <div onClick={e=>e.stopPropagation()} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:32,padding:40,animation:'scaleIn 0.4s var(--ease-spring)'}}>
      <div style={{textAlign:'center'}}>
        <h2 style={{fontFamily:'var(--font-display)',fontSize:24,color:'var(--text-primary)',marginBottom:4}}>{phase==='done'?'You made it.':'Ride the Craving'}</h2>
        <p style={{fontSize:13,color:'var(--text-secondary)'}}>{phase==='done'?'The craving has passed. You chose yourself.':'4-4-6 breathing to calm your nervous system'}</p>
      </div>
      <div style={{position:'relative'}}>
        <ProgressRing progress={ringP} color={pc} size={180} strokeWidth={6} animated={false}>
          <span style={{fontSize:48,fontWeight:300,color:pc,fontFamily:'var(--font-display)',animation:seconds>0?'countPulse 1s ease-in-out infinite':'none'}}>{phase==='idle'?'':phase==='done'?'\u2713':seconds}</span>
          <span style={{fontSize:14,fontWeight:600,color:'var(--text-secondary)',marginTop:4,letterSpacing:1,textTransform:'uppercase'}}>{pl}</span>
        </ProgressRing>
        {phase!=='idle'&&phase!=='done'&&<svg width={180} height={180} style={{position:'absolute',top:0,left:0,transform:'rotate(-90deg)'}}><circle cx={90} cy={90} r={87} fill="none" stroke={pc} strokeWidth={1} opacity={0.15} style={{animation:'breatheRing 4s ease-in-out infinite'}}/></svg>}
      </div>
      {phase!=='done'&&<div style={{display:'flex',gap:8}}>{Array.from({length:totalCycles},(_,i)=><div key={i} style={{width:8,height:8,borderRadius:'50%',background:i<cycle?'var(--accent-primary)':i===cycle&&phase!=='idle'?pc:'var(--surface-soft)',transition:'background-color 0.3s,border-color 0.3s,opacity 0.3s,transform 0.3s'}}/>)}</div>}
      {phase==='idle'&&<button onClick={()=>setPhase('inhale')} style={{padding:'14px 48px',borderRadius:40,border:'none',cursor:'pointer',fontSize:15,fontWeight:600,fontFamily:'var(--font-body)',background:'var(--accent-primary)',color:'var(--accent-on)'}}>Begin</button>}
      {phase==='done'&&<div style={{ display:'flex', flexDirection:'column', gap:12, alignItems:'center' }}>
        <button onClick={() => { onLogCraving && onLogCraving(true); onClose(); }} style={{padding:'14px 48px',borderRadius:40,border:'none',cursor:'pointer',fontSize:15,fontWeight:600,fontFamily:'var(--font-body)',background:'var(--accent-primary)',color:'var(--accent-on)'}}>Log This Craving</button>
        <button onClick={onClose} style={{padding:'10px 32px',borderRadius:40,border:'1px solid var(--border-medium)',cursor:'pointer',fontSize:13,fontWeight:600,fontFamily:'var(--font-body)',background:'transparent',color:'var(--text-secondary)'}}>I'm Good</button>
      </div>}
      <button onClick={onClose} style={{background:'none',border:'none',color:'var(--text-muted)',fontSize:13,cursor:'pointer',fontFamily:'var(--font-body)',padding:8}}>close</button>
    </div>
  </div>;
}

      <div style={{ fontSize:10, color:'var(--text-muted)', fontWeight:600, textTransform:'uppercase', letterSpacing:0.5, marginBottom:12 }}>Recent Entries</div>
      {all.slice(0, 10).map(c => (

          <div style={{ width:28, height:28, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', fontSize:14, background:'var(--surface-faint)', color: c.outcome === 'surfed' ? 'var(--accent-primary)' : 'var(--text-muted)' }}>{c.outcome === 'surfed' ? "\u2713" : "\u00B7"}</div>
          <div style={{ flex:1 }}>
            <div style={{ fontSize:12, color:'var(--text-primary)', display:'flex', gap:6 }}>
              <span style={{ color: c.intensity <= 3 ? 'var(--green)' : c.intensity <= 6 ? 'var(--amber)' : 'var(--rose)', fontWeight:600 }}>{c.intensity}/10</span>
              {(c.triggers || []).slice(0, 2).map(tid => { const t = triggerMap[tid]; return t ? <span key={tid} style={{ color:'var(--text-muted)' }}>{t.label}</span> : null; })}
            </div>
            {c.note && <div style={{ fontSize:11, color:'var(--text-muted)', marginTop:2 }}>{c.note}</div>}
          </div>
          <span style={{ fontSize:10, color:'var(--text-muted)' }}>{formatRelativeTime(c.timestamp)}</span>
        </div>
      ))}
    </div>}
  </div>;
}

function ThemeToggle({ prefix }) {
  const [theme, setTheme] = React.useState(() => localStorage.getItem(prefix + '_theme') || 'auto');
  React.useEffect(() => {
    const applyTheme = () => {
      let resolved = theme;
      if (theme === 'auto') { resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
      /* Swap the theme instantly rather than cross-fading every card, border
         and surface over 200-300ms, which reads as lag rather than polish.

         The related trap, fixed at the source in the transitions themselves:
         an element that transitions `color` never re-resolves a var()-backed
         colour when the theme attribute changes — verified in a minimal probe,
         and true for `transition: all` and `transition: color` alike, while
         background-color/border-color/opacity/transform all update fine. The
         tab labels kept the old theme's colour indefinitely, which was
         unreadable once the two themes stopped being two shades of slate. So
         nothing in this app transitions `color`. Keep it that way.

         A timer, not rAF: rAF never fires in a background tab, which would
         strand the page with transitions permanently off. */
      const root = document.documentElement;
      root.classList.add('theme-switching');
      root.setAttribute('data-theme', resolved);
      setTimeout(() => root.classList.remove('theme-switching'), 60);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', resolved === 'dark' ? '#17120E' : '#D8DFCB');
    };
    applyTheme();
    localStorage.setItem(prefix + '_theme', theme);
    if (theme === 'auto') {
      const mq = window.matchMedia('(prefers-color-scheme: dark)');
      mq.addEventListener('change', applyTheme);
      return () => mq.removeEventListener('change', applyTheme);
    }
  }, [theme]);
  const cycle = () => { const order = ['auto', 'light', 'dark']; setTheme(order[(order.indexOf(theme) + 1) % 3]); };
  const icons = { auto: '\u25D0', light: '\u2600', dark: '\u263E' };
  const labels = { auto: 'Auto', light: 'Light', dark: 'Dark' };
  return (
    <button onClick={cycle} title={`Theme: ${labels[theme]}`} style={{
      background:'var(--surface-faint)',
      color:'var(--text-muted)',width:36,height:36,borderRadius:'50%',cursor:'pointer',
      fontSize:16,display:'flex',alignItems:'center',justifyContent:'center'
    }}>{icons[theme]}</button>
  );
}

// IDENTITY CHECK-IN
// BCT 13.5 "identity associated with changed behaviour" was the strongest individual
// technique in Black et al. 2020 (113 trials, 235 groups, N=43,992, biochemically
// verified abstinence): OR 1.34 (1.08-1.67). In the best prospective study of the
// mechanism (Dingle et al. 2015, N=132), the CHANGE IN THE GAP between using-identity
// and recovery-identity accounted for 34% of variance in drinking quantity, 41% in
// frequency and 49% in life satisfaction, controlling for baseline severity.
// Two sliders and a subtraction. Unlike a day counter, the number is the user's own.
function IdentityCheck({ prefix, accent, usingLabel, freeLabel }) {
  const KEY = prefix + '_identity';
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY) || '[]') } catch { return [] } };
  const [log, setLog] = useState(read);
  const last = log.length ? log[log.length - 1] : null;
  const due = !last || (Date.now() - last.t) > 7 * 86400000;
  const [open, setOpen] = useState(false);
  const [u, setU] = useState(last ? last.using : 5);
  const [r, setR] = useState(last ? last.recovery : 5);
  const save = () => {
    const next = [...log, { t: Date.now(), using: u, recovery: r }];
    try { localStorage.setItem(KEY, JSON.stringify(next)) } catch {}
    setLog(next); setOpen(false);
  };
  const box = { margin: '8px 20px', padding: '14px 18px', borderRadius: 'var(--radius-md)',
                background:'var(--bg-card)' };
  const eyebrow = { fontSize: 8.5, color: accent, fontWeight:400, letterSpacing: '0.15em', textTransform: 'uppercase' };

  if (open || (due && !last)) {
    return <div style={box}>
      <div style={eyebrow}>How you see yourself</div>
      {[[usingLabel, u, setU], [freeLabel, r, setR]].map(([lab, val, set], i) =>
        <div key={i} style={{ marginTop: 12 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, color: 'var(--text-secondary)' }}>
            <span style={{ fontWeight:300 }}>Right now, how much do you feel like {lab}?</span><span style={{ color: accent, fontWeight:600 }}>{val}</span>
          </div>
          <input type="range" min="0" max="10" value={val} onChange={e => set(Number(e.target.value))}
            style={{ width: '100%', marginTop: 6, accentColor: accent }} />
        </div>)}
      <button onClick={save} style={{ width: '100%', marginTop: 14, padding: 11, borderRadius: 40, border: 'none',
        background: accent, color: 'var(--accent-on)', fontSize: 13, fontWeight:600, cursor: 'pointer',
        fontFamily: 'var(--font-body)' }}>Save how it feels today</button>
      <p style={{ fontSize: 10, color: 'var(--text-muted)', marginTop: 8, lineHeight: 1.5 }}>
        Only you see this. It is the one number here that comes from you rather than the clock.</p>
    </div>;
  }

  const gap = last.recovery - last.using;
  const first = log[0];
  const moved = log.length > 1 ? gap - (first.recovery - first.using) : null;
  return <div style={box}>
    <div style={eyebrow}>How you see yourself</div>
    <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, marginTop: 6 }}>
      <span style={{ fontFamily: 'var(--font-display)', fontWeight: 400, fontSize: 27, color: 'var(--text-hi)' }}>
        {gap > 0 ? '+' : ''}{gap}</span>
      <span style={{ fontSize: 12, color: 'var(--text-secondary)', lineHeight: 1.4 }}>
        {gap > 0 ? `closer to ${freeLabel} than to ${usingLabel}` :
         gap < 0 ? `still closer to ${usingLabel} than to ${freeLabel}` :
         `evenly split between the two`}</span>
    </div>
    {moved !== null && moved !== 0 && <div style={{ fontSize: 10, color: 'var(--text-muted)', marginTop: 6 }}>
      {moved > 0 ? 'up ' + moved : 'down ' + Math.abs(moved)} since your first check-in{log.length > 1 ? ', ' + log.length + ' readings' : ''}</div>}
    <button onClick={() => setOpen(true)} style={{ marginTop: 10, background: 'none', border: 'none', padding: 0,
      color: accent, fontSize: 11, fontWeight: 600, cursor: 'pointer', fontFamily: 'var(--font-body)' }}>
      {due ? 'Check in again' : 'Update'}</button>
  </div>;
}

        </div>;})()}
      <div style={{marginTop:14,fontSize:11.5,fontWeight:300,color:'var(--text-secondary)'}}>{formatDuration(elapsed)} this run</div>

    {(()=>{const all=CravingStore.getAll().filter(c=>c.note&&c.note.trim());

function App() {

}

<script>
/* Clear Suite update channel.
   Deliberately plain JS in its own script tag, NOT a React component: this
   must keep working when React/Babel fail to load, because that is exactly
   the deploy an update needs to repair. */
(function () {
  if (!('serviceWorker' in navigator)) return;

  var MIN_INTERVAL  = 30 * 1000;
  var POLL_INTERVAL = 30 * 60 * 1000;
  var hadController = !!navigator.serviceWorker.controller;
  var lastCheck     = Date.now();
  var reg           = null;

  window.__CS_VERSION = null;

  function show() {
    if (document.getElementById('cs-update')) return;
    var el = document.createElement('div');
    el.id = 'cs-update';
    el.setAttribute('role', 'status');
    el.setAttribute('aria-live', 'polite');
    /* zIndex 90 sits BELOW the app's modals (zIndex 100), so an open craving
       log or breathing overlay hides this automatically. */
    el.style.cssText =
      'position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:90;' +
      'width:calc(100% - 32px);max-width:380px;box-sizing:border-box;' +
      'padding:14px 16px;border-radius:var(--radius-lg);' +
      'background:var(--accent-primary),var(--bg-card);' +
      'border:1px solid var(--border-medium);backdrop-filter:blur(16px);' +
      '-webkit-backdrop-filter:blur(16px);box-shadow:0 8px 32px rgba(0,0,0,0.4);' +
      'display:flex;align-items:center;gap:12px;animation:slideDown 0.5s var(--ease-spring);' +
      'font-family:var(--font-body);letter-spacing:-0.01em';

    var txt = document.createElement('div');
    txt.style.cssText = 'flex:1;min-width:0';
    txt.innerHTML =
      '<div style="font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;' +
      'color:var(--accent-primary)">Update ready</div>' +
      '<div style="font-size:14px;font-weight:600;color:var(--text-primary);margin-top:2px">' +
      'A new version is ready</div>' +
      '<div style="font-size:11px;color:var(--text-secondary);margin-top:2px">' +
      'Your progress is saved either way.</div>';

    var reload = document.createElement('button');
    reload.textContent = 'Reload';
    reload.style.cssText =
      'flex:none;background:var(--accent-primary);border:none;color:var(--bg-deep);' +
      'font-family:var(--font-body);font-size:12px;font-weight:700;letter-spacing:0.3px;' +
      'padding:9px 14px;border-radius:var(--radius-sm);cursor:pointer';
    reload.onclick = function () { window.location.reload(); };

    var later = document.createElement('button');
    later.setAttribute('aria-label', 'Dismiss');
    later.innerHTML = '×';
    later.style.cssText =
      'flex:none;background:var(--surface-soft);border:none;color:var(--text-secondary);' +
      'width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px;line-height:1';
    /* Dismiss only hides it. The update is already in Cache Storage, so the
       user gets it on their next cold launch regardless. */
    later.onclick = function () { el.remove(); };

    el.appendChild(txt); el.appendChild(reload); el.appendChild(later);
    document.body.appendChild(el);
  }

  function check() {
    var now = Date.now();
    if (now - lastCheck < MIN_INTERVAL) return;
    lastCheck = now;
    if (reg) { try { reg.update(); } catch (_) {} }
    if (navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage({ type: 'CHECK_UPDATE' });
    }
  }

  function askVersion() {
    if (!navigator.serviceWorker.controller || !window.MessageChannel) return;
    var ch = new MessageChannel();
    ch.port1.onmessage = function (ev) {
      if (ev.data && ev.data.type === 'VERSION') {
        window.__CS_VERSION = ev.data.version;
        window.dispatchEvent(new CustomEvent('cs-version', { detail: ev.data }));
      }
    };
    navigator.serviceWorker.controller.postMessage({ type: 'GET_VERSION' }, [ch.port2]);
  }

  navigator.serviceWorker.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.type === 'UPDATE_READY') show();
    else if (d.type === 'HTML_REPLACED') { window.__CS_VERSION = d.version; }
  });

  /* Do NOT reload here — the classic footgun that reloads a user mid-session. */
  navigator.serviceWorker.addEventListener('controllerchange', askVersion);

  /* iOS has no Periodic Background Sync, so every check is user-driven:
     resume, focus, regained network. iOS also often restores a frozen page
     instead of reloading, which is why pageshow/visibilitychange matter most. */
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') check();
  });
  window.addEventListener('focus', check);
  window.addEventListener('online', check);
  window.addEventListener('pageshow', function (e) { if (e.persisted) check(); });
  setInterval(function () { if (document.visibilityState === 'visible') check(); }, POLL_INTERVAL);

  navigator.serviceWorker.register('/sw.js', { scope: '/', updateViaCache: 'none' })
    .then(function (r) {
      reg = r;
      askVersion();
      r.addEventListener('updatefound', function () {
        var nw = r.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function () {
          if (nw.state === 'activated' && hadController) show();
        });
      });
    })
    .catch(function () { /* SW unavailable: app still works, just no offline */ });
})();
</script>
</body>
</html>
